name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: callguard
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: callguard
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U callguard' --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://callguard:testpassword@localhost:5432/callguard
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r backend/requirements-auth.txt
      - run: alembic upgrade head && pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: frontend

# Настройки инструментов backend (зависимости лежат в requirements*.txt).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F — ошибки, I — порядок импортов, UP — современный синтаксис,
# B — типичные баги, S — проверки безопасности (bandit).
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы assert и фиктивные пароли.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "slow: тесты на реальных моделях (faster-whisper, Ollama); в CI по умолчанию пропускаются",
]

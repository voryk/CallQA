[project]
name = "callqa-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "alembic", "pydantic-settings",
  "python-multipart", "faster-whisper", "vosk", "pydub", "httpx", "argon2-cffi",
  "pyjwt", "sse-starlette", "reportlab", "cryptography",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

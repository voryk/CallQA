services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes: ["./data:/app/data", "./models:/app/models"]
    depends_on: [ollama]
    networks: [internal]
  worker:
    build: ./backend
    command: python -m app.queue.worker
    env_file: .env
    volumes: ["./data:/app/data", "./models:/app/models"]
    depends_on: [ollama]
    networks: [internal]
  ollama:
    image: ollama/ollama
    volumes: ["./models/ollama:/root/.ollama"]
    networks: [internal]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    networks: [internal, lan]
networks:
  internal:
    internal: true   # без доступа в интернет
  lan: {}

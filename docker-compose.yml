name: callguard-rachik5
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./backend
    image: callguard-rachik5-api:local
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0"
    environment: &app_env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/storage
      WHISPER_MODEL_PATH: /srv/models/whisper
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes: &app_volumes
      - ./backend/storage:/srv/storage
      - ./models:/srv/models:ro
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      api:
        condition: service_healthy
  retention:
    build: ./backend
    command: sh -c "while true; do python -m app.retention; sleep 86400; done"
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      api:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.5.13
    environment:
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: callguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: callguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callguard -d callguard"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
  ollamadata:

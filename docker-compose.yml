services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0"
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://callguard:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/callguard
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/storage
      WHISPER_MODEL_PATH: /srv/models/whisper
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes: &app_volumes
      - ./backend/storage:/srv/storage
      - ./models:/srv/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: ./backend
    command: python -m app.worker
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      api:
        condition: service_started
  retention:
    build: ./backend
    command: sh -c "while true; do python -m app.retention; sleep 86400; done"
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      api:
        condition: service_started
  ollama:
    image: ollama/ollama:latest
    profiles: ["assessment"]
    environment:
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollamadata:/root/.ollama
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: callguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      POSTGRES_DB: callguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callguard -d callguard"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
  ollamadata:
